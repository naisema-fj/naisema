name: Deploy to staging

# Staging: every push to the default branch, after CI passes. Run it by hand too (Actions >
# Deploy to staging > Run workflow) to redeploy staging. Production has its own one-button
# workflow, .github/workflows/deploy-production.yml.
# The job stays skipped until the repository variable CLOUDFLARE_ACCOUNT_ID is set, and skips with
# a warning while wrangler.jsonc still has staging placeholders, so CI stays green before
# Cloudflare is provisioned (docs/handover/runbook.md).

on:
  push:
    # The repository's default branch. Update this if the default branch is renamed.
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  staging:
    name: Deploy to staging
    needs: ci
    if: vars.CLOUDFLARE_ACCOUNT_ID != '' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment: staging
    concurrency: deploy-staging
    timeout-minutes: 15
    env:
      CLOUDFLARE_ENV: staging
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      # Until staging is set up for v1 (bash scripts/setup-environment.sh staging), wrangler.jsonc
      # still holds placeholders: the deploy is skipped with a warning, so main stays green.
      - name: Check staging is set up in wrangler.jsonc
        id: config
        run: |
          if grep -q "REPLACE_WITH_STAGING" wrangler.jsonc; then
            echo "::warning::Staging isn't set up for v1 yet, so nothing was deployed. Run bash scripts/setup-environment.sh staging (docs/handover/runbook.md, provisioning)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.config.outputs.ready == 'true'
        uses: pnpm/action-setup@v6
      - if: steps.config.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - if: steps.config.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.config.outputs.ready == 'true'
        run: pnpm build
      - if: steps.config.outputs.ready == 'true'
        run: pnpm wrangler d1 migrations apply DB --remote --env staging --config wrangler.jsonc
      - if: steps.config.outputs.ready == 'true'
        run: pnpm wrangler deploy
