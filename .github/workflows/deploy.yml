name: Deploy

# Staging: every push to the default branch, after CI passes.
# Production: a pushed `v*` tag, gated by the `production` GitHub environment
# (configure required reviewers on that environment for manual approval).
# Both jobs stay skipped until the repository variable CLOUDFLARE_ACCOUNT_ID
# is set, so CI stays green before Cloudflare is provisioned (docs/handover/runbook.md).

on:
  push:
    # The repository's default branch. Update this list if the default branch is renamed.
    branches: ["main", "claude/brave-davinci-1caxw4"]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    if: github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch
    uses: ./.github/workflows/ci.yml

  staging:
    name: Deploy to staging
    needs: ci
    if: github.ref_type == 'branch' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    environment: staging
    concurrency: deploy-staging
    timeout-minutes: 15
    env:
      CLOUDFLARE_ENV: staging
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Check the staging D1 database ID is configured
        run: |
          if grep -q REPLACE_WITH_STAGING wrangler.jsonc; then
            echo "::error::Set the staging database_id in wrangler.jsonc (docs/handover/runbook.md, provisioning)."; exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm wrangler d1 migrations apply DB --remote --env staging --config wrangler.jsonc
      - run: pnpm wrangler deploy

  production:
    name: Deploy to production
    needs: ci
    if: github.ref_type == 'tag' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    environment: production
    concurrency: deploy-production
    timeout-minutes: 15
    env:
      CLOUDFLARE_ENV: production
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Check the tag is on the default branch
        run: |
          git fetch --no-tags origin "${{ github.event.repository.default_branch }}"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::Production tags must point at a commit on the default branch."; exit 1
          fi
      - name: Check the production D1 database ID is configured
        run: |
          if grep -q REPLACE_WITH_PRODUCTION wrangler.jsonc; then
            echo "::error::Set the production database_id in wrangler.jsonc (docs/handover/runbook.md, provisioning)."; exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm wrangler d1 migrations apply DB --remote --env production --config wrangler.jsonc
      - run: pnpm wrangler deploy
