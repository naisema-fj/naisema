name: Deploy

# Staging: every push to the default branch, after CI passes.
# Production: a pushed `v*` tag, gated by the `production` GitHub environment
# (configure required reviewers on that environment for manual approval).
# Manual: Actions > Deploy > Run workflow, then pick staging or production and a
# branch or tag. The same gates apply: CI, the production approval, and production
# only ever deploys a commit that is on the default branch.
# Both jobs stay skipped until the repository variable CLOUDFLARE_ACCOUNT_ID
# is set, so CI stays green before Cloudflare is provisioned (docs/handover/runbook.md).
# Staging is also skipped, with a warning, while wrangler.jsonc still has its
# placeholders; a production tag with placeholders fails, since a release is deliberate.

on:
  push:
    # The repository's default branch. Update this if the default branch is renamed.
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy the selected branch or tag
        type: choice
        options: [staging, production]
        default: staging
        required: true

permissions:
  contents: read

jobs:
  ci:
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch
    uses: ./.github/workflows/ci.yml

  staging:
    name: Deploy to staging
    needs: ci
    if: >-
      vars.CLOUDFLARE_ACCOUNT_ID != '' &&
      ((github.event_name == 'push' && github.ref_type == 'branch') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging'))
    runs-on: ubuntu-latest
    environment: staging
    concurrency: deploy-staging
    timeout-minutes: 15
    env:
      CLOUDFLARE_ENV: staging
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      # Until staging is set up for v1 (bash scripts/setup-environment.sh staging), wrangler.jsonc
      # still holds placeholders: the deploy is skipped with a warning, so main stays green.
      - name: Check staging is set up in wrangler.jsonc
        id: config
        run: |
          if grep -q "REPLACE_WITH_STAGING" wrangler.jsonc; then
            echo "::warning::Staging isn't set up for v1 yet, so nothing was deployed. Run bash scripts/setup-environment.sh staging (docs/handover/runbook.md, provisioning)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.config.outputs.ready == 'true'
        uses: pnpm/action-setup@v6
      - if: steps.config.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - if: steps.config.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.config.outputs.ready == 'true'
        run: pnpm build
      - if: steps.config.outputs.ready == 'true'
        run: pnpm wrangler d1 migrations apply DB --remote --env staging --config wrangler.jsonc
      - if: steps.config.outputs.ready == 'true'
        run: pnpm wrangler deploy

  production:
    name: Deploy to production
    needs: ci
    if: >-
      vars.CLOUDFLARE_ACCOUNT_ID != '' &&
      ((github.event_name == 'push' && github.ref_type == 'tag') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'production'))
    runs-on: ubuntu-latest
    environment: production
    concurrency: deploy-production
    timeout-minutes: 15
    env:
      CLOUDFLARE_ENV: production
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Check the tag is on the default branch
        run: |
          git fetch --no-tags origin "${{ github.event.repository.default_branch }}"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::Production tags must point at a commit on the default branch."; exit 1
          fi
      - name: Check the production D1 database ID is configured
        run: |
          if grep -Eq "REPLACE_WITH_(PRODUCTION|TURNSTILE)" wrangler.jsonc; then
            echo "::error::Set the production database_id and Turnstile site key in wrangler.jsonc (docs/handover/runbook.md, provisioning)."; exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm wrangler d1 migrations apply DB --remote --env production --config wrangler.jsonc
      - run: pnpm wrangler deploy
