# clamd for the upload scanner. Limits fit the largest upload (2 GB video masters,
# docs/decision-log.md); anything the scanner can't fully read is reported, never passed.
LocalSocket /tmp/clamd.sock
LocalSocketMode 660
Foreground yes
LogTime yes
DatabaseDirectory /var/lib/clamav
# Reload signatures within the hour after freshclam updates them.
SelfCheck 3600
ConcurrentDatabaseReload no
ReadTimeout 300
StreamMaxLength 2100M
MaxFileSize 2100M
MaxScanSize 4000M
MaxRecursion 16
MaxFiles 10000
# Report what can't be scanned (over a limit, encrypted, broken executables) instead of passing it.
AlertExceedsMax yes
AlertEncrypted yes
AlertBrokenExecutables yes
