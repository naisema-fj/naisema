<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stream timing spike</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 1rem; max-width: 60rem; }
      video { width: 100%; max-height: 70vh; background: #000; }
      fieldset { margin: 0.75rem 0; }
      output { font-family: ui-monospace, monospace; white-space: pre; display: block; }
    </style>
  </head>
  <body>
    <h1>Stream timing spike (issue #4)</h1>
    <p>Throwaway prototype. Pass <code>?src=</code> a master playlist (a Cloudflare Stream signed HLS URL, or a local one).</p>
    <!-- biome-ignore lint/a11y/useMediaCaption: player.js attaches the captions track, built from the segment data. -->
    <video id="video" playsinline crossorigin="anonymous"></video>
    <fieldset>
      <legend>Segment</legend>
      <label>Start (ms) <input id="start" type="number" value="12000" /></label>
      <label>End (ms) <input id="end" type="number" value="15500" /></label>
      <label>Speed
        <select id="speed">
          <option value="1">1×</option>
          <option value="0.75">0.75×</option>
          <option value="0.5">0.5×</option>
        </select>
      </label>
      <button id="replay" type="button">Replay</button>
      <button id="loop" type="button">Loop 10 times</button>
      <button id="switch" type="button">Force a quality change</button>
    </fieldset>
    <output id="log" aria-live="polite"></output>
    <!-- The light build (no DRM or subtitle parsing: captions are our own native <track>), as an app would ship it. -->
    <script src="./node_modules/hls.js/dist/hls.light.min.js"></script>
    <script type="module" src="./player.js"></script>
  </body>
</html>
